---
# Updated for Apple Silicon Macs - January 2025

# uv replaces pyenv (it manages Python versions and venvs). Python packages (uv, poetry, pdm) are in the Brewfile.

# =============================================================================
# PIP CONFIGURATION
# Uses modern XDG-compliant path (~/.config/pip/)
# =============================================================================
- name: Add pip config directory
  file:
    path: ~/.config/pip
    state: directory
    mode: '0755'
  tags: python

- name: Setup pip configuration
  copy:
    dest: ~/.config/pip/pip.conf
    src: pip.conf
  tags: python
