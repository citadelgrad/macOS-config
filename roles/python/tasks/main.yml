---
# Updated for Apple Silicon Macs - January 2025
# uv replaces pyenv: uv manages Python versions and virtual environments.
# The pyenv, pyenv-virtualenv and Python build-dependency install task was removed.

# =============================================================================
# PYTHON PACKAGE MANAGERS
# =============================================================================
- name: Install Python package managers
  community.general.homebrew:
    name:
      - poetry                   # Dependency management & packaging
      - uv                       # Fast Python package installer & resolver
    state: present
  when: ansible_facts['os_family'] == 'Darwin'
  tags: python

# =============================================================================
# PIP CONFIGURATION
# Uses modern XDG-compliant path (~/.config/pip/)
# =============================================================================
- name: Add pip config directory
  file:
    path: ~/.config/pip
    state: directory
    mode: '0755'
  tags: python

- name: Setup pip configuration
  copy:
    dest: ~/.config/pip/pip.conf
    src: pip.conf
  tags: python
